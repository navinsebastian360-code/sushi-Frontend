<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi — Transit Social Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass {
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-[#0b0e14] text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-rose-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-[#0e121b]/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-rose-500 to-amber-400 flex items-center justify-center font-bold text-white shadow-lg shadow-rose-500/20">
          S
        </div>
        <span class="font-extrabold tracking-tight text-lg bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
          Sushi
        </span>
      </div>
      <div class="flex items-center space-x-2 text-xs font-medium text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2.5 py-1 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Gateway Live</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl w-full mx-auto px-5 py-8 flex-1">
    
    <!-- Hero Text -->
    <div class="mb-8 text-center">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-2">
        Meet aligned minds on your journey.
      </h1>
      <p class="text-sm text-slate-400">
        Let's begin.
      </p>
    </div>

    <!-- Check-In Card Form -->
    <div id="checkin-container" class="glass rounded-2xl p-6 shadow-2xl space-y-6">
      
      <!-- PNR Input -->
      <div>
        <label for="pnr" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          Indian Railways PNR Number
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="pnr" 
            maxlength="10" 
            autocomplete="off"
            placeholder="10-digit PNR (e.g. 9999999991)" 
            class="w-full bg-[#121722] border border-slate-700/80 rounded-xl px-4 py-3.5 text-white font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition-all placeholder:text-slate-600 text-sm"
          >
          <span class="absolute right-3.5 top-3.5 text-xs text-slate-500 font-mono" id="pnr-counter">0/10</span>
        </div>
        <p class="text-[11px] text-slate-500 mt-1.5 flex items-center gap-1">
          <span>🔒 Ephemeral encryption. Seat numbers are never publicly disclosed.</span>
        </p>
      </div>

      <!-- Identity Inputs -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Display Name</label>
          <input type="text" id="real_name" placeholder="Your name or handle" class="w-full bg-[#121722] border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Age</label>
            <input type="number" id="age" min="16" max="99" value="25" class="w-full bg-[#121722] border border-slate-700/80 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Gender</label>
            <select id="gender" class="w-full bg-[#121722] border border-slate-700/80 rounded-xl px-2 py-3 text-white focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Intent Mode Selector -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">Transit Intent Mode</label>
        <div class="grid grid-cols-3 gap-2" id="intent-group">
          <button type="button" data-intent="Networking" class="intent-btn active bg-
